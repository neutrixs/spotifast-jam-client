name: Release

# Linux and Windows downloads for this fork, with jams.
#
# Pushing a v* tag builds them and publishes a GitHub release, signed with
# the fork's update key so installed copies update to it. Run it by hand
# from the Actions tab ("Run workflow") to build the same downloads without
# releasing anything: they are attached to the run as one download.
#
# A tag on a commit that a run by hand already built, and whose downloads
# have not expired, publishes those very downloads instead of building
# again: what was tried is what is released.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Reading a run by hand's downloads, to release them.
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # The run by hand whose downloads a tag releases, if there is one.
      reuse: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      # Downloads are named after the tag, but the binary reports the crate's
      # version: the two must agree, or a release carries one version's name
      # and another's code (upstream #1080). A run by hand takes the crate's.
      - id: tag
        run: |
          version=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version; bump the crate's version or retag"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # Only a build of this very commit: the tag says what code it is.
      - id: reuse
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: spotifast-${{ steps.tag.outputs.tag }}-test-build
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
            --event workflow_dispatch --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT\" and (.expired | not)) | .id" | grep -q .; then
            echo "Releasing the downloads of run $run, built from $GITHUB_SHA"
            echo "run=$run" >> "$GITHUB_OUTPUT"
          else
            echo "No unexpired build of $GITHUB_SHA by hand: building"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.reuse == ''
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            appimage: appimage-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimage: appimage-arm64
          # Each Windows binary is built and started on its own processor.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
            pe-machine: 8664 machine \(x64\)
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
            pe-machine: AA64 machine \(ARM64\)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the target to the toolchain
      # the pin resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: Build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM (MilkDrop) reads OpenGL through GLEW on Windows, built
      # against vcpkg's static-CRT triplet to match .cargo/config.toml.
      - name: GLEW for MilkDrop
        if: runner.os == 'Windows'
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      # Ninja inside the MSVC environment builds libprojectM whichever Visual
      # Studio the runner has; dumpbin below comes from it too.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - run: cargo build --release --target ${{ matrix.target }}

      # The installer and zip must run on a clean Windows machine, on the
      # processor they are named for, and report the release's version.
      - name: Check the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') { throw "$binary is not built for ${{ matrix.target }}" }
          $version = (& $binary --version | Out-String).Trim()
          $expected = "spotifast " + "$env:TAG".TrimStart("v")
          if ($version -ne $expected) { throw "The binary reports $version, not $expected" }

      # The checked binary goes to the windows job, which packages both
      # processors on x64, where the installer's tools run.
      - name: Hand the Windows binary on
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: exe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/spotifast.exe
          if-no-files-found: error

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: runner.os == 'Linux'
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        if: runner.os == 'Linux'
        run: gem install native-packages --version 0.11.0 --no-document

      - name: Linux archive
        if: runner.os == 'Linux'
        run: |
          name="spotifast-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast" "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cp --parents packaging/applications/spotifast.desktop packaging/icons/spotifast.svg "dist/$name/"
          cp --parents contrib/omarchy/spotifast.json.tpl contrib/omarchy/spotifast-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          rm -r "$name"

      # Built from the archive above. Its .zsync file and the signed
      # checksums let it replace itself with the next release.
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zsync
          native-packages build --version "${TAG#v}" --target ${{ matrix.appimage }} --defer-recipes \
            --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/${{ matrix.appimage }}/appimage/"*.AppImage \
            "$RUNNER_TEMP/appimage/packages/${{ matrix.appimage }}/appimage/"*.AppImage.zsync dist/

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.target }})
    needs: [version, build]
    runs-on: windows-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package-target: windows-amd64
            msvc-arch: x64
          # The installer's custom actions cross-compile for arm64 from x64.
          - target: aarch64-pc-windows-msvc
            package-target: windows-arm64
            msvc-arch: amd64_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: exe-${{ matrix.target }}
          path: target/${{ matrix.target }}/release

      - name: Windows zip
        shell: bash
        run: |
          name="spotifast-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast.exe" "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        run: gem install native-packages --version 0.11.0 --no-document
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # The Windows installer: per user, no administrator needed. It
      # replaces an installed Spotifast, keeping its settings, and registers
      # spotify: and spotifast-jam: links. Unsigned: Windows warns once.
      - name: Windows installer
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version "$env:TAG".TrimStart("v") --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  publish:
    name: ${{ github.ref_type == 'tag' && 'GitHub release' || 'Downloads' }}
    needs: [version, build, windows]
    # Built here, or built before by hand and reused.
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      (needs.version.outputs.reuse != '' ||
       (needs.build.result == 'success' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The packages only: the exe-* artifacts are the windows job's input.
      - uses: actions/download-artifact@v7
        if: needs.version.outputs.reuse == ''
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Source archive
        if: needs.version.outputs.reuse == ''
        run: git archive --format=tar.gz --prefix="spotifast-${TAG}/" -o "dist/spotifast-${TAG}-source.tar.gz" HEAD
      - name: Public filenames and checksums
        if: needs.version.outputs.reuse == ''
        run: python3 packaging/release-names.py dist "$TAG"
      # Or everything, checksums and source included, as the run by hand
      # made it; the checksum check below confirms every file arrived whole.
      - uses: actions/download-artifact@v7
        if: needs.version.outputs.reuse != ''
        with:
          name: spotifast-${{ needs.version.outputs.tag }}-test-build
          path: dist
          run-id: ${{ needs.version.outputs.reuse }}
          github-token: ${{ github.token }}

      # Installed copies take an update only with checksums.txt.sig: a raw
      # Ed25519 signature over checksums.txt that fastframe-update checks
      # against assets/update-public-key.hex. The secret is the fork's key as
      # a PEM file. Checking the signature against the committed key here
      # means a wrong secret fails the release, not every updater.
      - name: Sign checksums
        if: github.ref_type == 'tag'
        env:
          SPOTIFAST_UPDATE_SIGNING_KEY: ${{ secrets.SPOTIFAST_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPOTIFAST_UPDATE_SIGNING_KEY" ]; then
            echo "::error::Add the SPOTIFAST_UPDATE_SIGNING_KEY secret (the update signing key's PEM file)"
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing-key.pem"
          public="$RUNNER_TEMP/update-public-key.pem"
          ( umask 077 && printf '%s\n' "$SPOTIFAST_UPDATE_SIGNING_KEY" > "$key" )
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in dist/checksums.txt -out dist/checksums.txt.sig
          rm -f "$key"
          # The committed public key behind the DER prefix of an Ed25519 key.
          { printf '302a300506032b6570032100'; tr -d '[:space:]' < assets/update-public-key.hex; } |
            xxd -r -p | openssl pkey -pubin -inform DER -out "$public"
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin \
            -in dist/checksums.txt -sigfile dist/checksums.txt.sig
      - name: Every download matches its checksum
        run: cd dist && sha256sum --check --strict checksums.txt

      # A run by hand stops here, with everything attached to the run.
      - name: Attach the downloads to this run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: spotifast-${{ needs.version.outputs.tag }}-test-build
          path: dist/*
          if-no-files-found: error

      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          notes="packaging/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            printf 'Spotifast %s, with jams.\n' "$TAG" > "$notes"
          fi
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*
          name: Spotifast ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # A tag with a suffix (v0.17.101-rc1) is a pre-release, which
          # installed copies are never offered.
          prerelease: ${{ contains(github.ref_name, '-') }}
